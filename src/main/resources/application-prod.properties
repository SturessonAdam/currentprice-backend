# Production configuration for optimal performance

# Server configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# Undertow production tuning
server.undertow.threads.io=8
server.undertow.threads.worker=128
server.undertow.buffer-size=2048
server.undertow.direct-buffers=true
server.undertow.max-http-post-size=0
server.undertow.eager-filter-init=true

# HTTP/2 and security
server.http2.enabled=true
server.ssl.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Connection timeouts
server.servlet.session.timeout=15m
server.connection-timeout=10000

# Jackson optimizations
spring.jackson.generator.ignore-unknown=true
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.deserialization.fail-on-unknown-properties=false

# Actuator for production monitoring
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=never
management.metrics.export.simple.enabled=true
management.metrics.tags.application=${spring.application.name}

# Production logging
logging.level.org.example.elprisappbackend=INFO
logging.level.org.springframework.cache=WARN
logging.level.org.springframework.web=WARN
logging.level.reactor.netty=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Cache configuration for production
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=24h,recordStats

# HTTP client timeouts
spring.mvc.async.request-timeout=15000

# Thread pools - optimized for container environment
spring.task.execution.pool.core-size=16
spring.task.execution.pool.max-size=64
spring.task.execution.pool.queue-capacity=2000
spring.task.execution.thread-name-prefix=elpris-task-
spring.task.execution.pool.keep-alive=120s

# Scheduling
spring.task.scheduling.pool.size=8
spring.task.scheduling.thread-name-prefix=elpris-scheduling-

# Disable unnecessary features in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# JPA optimizations (if database is added later)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

# Production security
server.error.include-stacktrace=never
server.error.include-message=never