spring.application.name=elpris-app-backend

# Server Performance Optimization
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Undertow server tuning
server.undertow.threads.io=4
server.undertow.threads.worker=64
server.undertow.buffer-size=1024
server.undertow.direct-buffers=true
server.undertow.max-http-post-size=0

# HTTP/2 support
server.http2.enabled=true

# Connection timeout settings
server.servlet.session.timeout=30m
server.connection-timeout=20000

# Jackson Performance
spring.jackson.generator.ignore-unknown=true
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=true

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true

# Logging optimization
logging.level.org.example.elprisappbackend=INFO
logging.level.org.springframework.cache=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# HTTP client configuration
spring.mvc.async.request-timeout=30000

# Thread pool configuration for async processing
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=32
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=elpris-task-
spring.task.execution.pool.keep-alive=60s

# Scheduling thread pool
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=elpris-scheduling-

# Security headers for better performance
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
